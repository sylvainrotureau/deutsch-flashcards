<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulaire Allemand A2 - B1 | Sommaire</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1><i class="fa-solid fa-graduation-cap"></i> Deutsch Lernen : A2 - B1</h1>
      <p>Choisissez un thème pour commencer votre session de révision</p>
    </header>

    <main id="themes-container">
      <!-- Les thèmes seront injectés dynamiquement ici -->
      <p style="text-align: center; color: var(--text-muted);">Chargement des fiches...</p>
    </main>
  </div>

  <script>
    async function loadManifest() {
      try {
        const response = await fetch('data/manifest.json');
        const themes = await response.json();
        
        const container = document.getElementById('themes-container');
        container.innerHTML = ''; // Nettoyer le message de chargement

        // Regrouper par niveau (A2, B1, etc.)
        const levels = {};
        themes.forEach(theme => {
          if (!levels[theme.level]) levels[theme.level] = [];
          levels[theme.level].push(theme);
        });

        // Générer le HTML par niveau
        for (const [level, items] of Object.entries(levels)) {
          let sectionHTML = `
            <section class="level-section">
              <h2 class="badge-level level-${level.toLowerCase()}">Niveau ${level}</h2>
              <div class="cards-grid">
          `;

          items.forEach(theme => {
            // On passe le nom du fichier sans extension dans l'URL
            const fileParam = encodeURIComponent(theme.filename);
            sectionHTML += `
              <a href="app.html?theme=${fileParam}" class="theme-card">
                <div class="theme-icon"><i class="fa-solid ${theme.icon || 'fa-folder'}"></i></div>
                <div class="theme-info">
                  <h3>${theme.title}</h3>
                  <p>${theme.description}</p>
                  <span class="count-tag"><i class="fa-solid fa-layer-group"></i> ${theme.level}</span>
                </div>
              </a>
            `;
          });

          sectionHTML += `</div></section>`;
          container.innerHTML += sectionHTML;
        }

      } catch (error) {
        document.getElementById('themes-container').innerHTML = `
          <p style="text-align: center; color: #ef4444;">Erreur de chargement du manifeste des thèmes. Assurez-vous d'utiliser un serveur local (Live Server).</p>
        `;
        console.error("Erreur manifeste :", error);
      }
    }

    loadManifest();
  </script>
</body>
</html>
