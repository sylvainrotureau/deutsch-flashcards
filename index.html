<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulaire Allemand | Sommaire</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1><i class="fa-solid fa-graduation-cap"></i> Deutsch Lernen</h1>
      <p>Choisissez un thème pour commencer votre session de révision</p>
    </header>

    <main id="themes-container">
      <p style="text-align: center; color: var(--text-muted);">Chargement des fiches...</p>
    </main>
  </div>

  <script>
    async function loadManifest() {
      const container = document.getElementById('themes-container');
      try {
        const response = await fetch('data/manifest.json?v=' + Date.now());
        if (!response.ok) throw new Error("Impossible de charger manifest.json");
        
        const themes = await response.json();
        container.innerHTML = ''; 

        const levels = {};
        themes.forEach(theme => {
          const lvl = theme.level || 'Général';
          if (!levels[lvl]) levels[lvl] = [];
          levels[lvl].push(theme);
        });

        for (const [level, items] of Object.entries(levels)) {
          let sectionHTML = `
            <section class="level-section">
              <h2 class="badge-level level-${level.toLowerCase().replace(/[^a-z0-9]/g, '')}">Niveau ${level}</h2>
              <div class="cards-grid">
          `;

          items.forEach(theme => {
            const fileParam = encodeURIComponent(theme.filename);
            sectionHTML += `
              <a href="app.html?theme=${fileParam}" class="theme-card">
                <div class="theme-icon"><i class="fa-solid ${theme.icon || 'fa-folder'}"></i></div>
                <div class="theme-info">
                  <h3>${theme.title}</h3>
                  <p>${theme.description}</p>
                  <span class="count-tag"><i class="fa-solid fa-layer-group"></i> ${theme.level}</span>
                </div>
              </a>
            `;
          });

          sectionHTML += `</div></section>`;
          container.innerHTML += sectionHTML;
        }

      } catch (error) {
        container.innerHTML = `
          <div style="text-align: center; color: #ef4444; padding: 20px;">
            <i class="fa-solid fa-circle-exclamation" style="font-size: 2rem; margin-bottom: 10px;"></i>
            <p><strong>Erreur de chargement du sommaire</strong></p>
          </div>
        `;
        console.error("Erreur manifeste :", error);
      }
    }

    loadManifest();
  </script>
</body>
</html>
